
<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Улан & Толкунай — Тойго чакыруу</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #fbf5ed;
    color: #a8793d;
    font-family: Georgia, serif;
    text-align: center;
}

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
    background: linear-gradient(#fbf4eb, #fffaf4, #f8eee3);
}

.ornament {
    font-size: 32px;
    margin-bottom: 35px;
}

.intro {
    font-size: 20px;
    margin-bottom: 30px;
}

.names {
    font-size: clamp(55px, 11vw, 95px);
    font-style: italic;
    line-height: 1.15;
    color: #ad803f;
}

.amp {
    font-size: 65px;
    margin: 5px;
}

.date {
    font-size: 23px;
    margin: 30px 0;
}

.open-btn {
    padding: 16px 32px;
    border: 1px solid #bd8a4a;
    border-radius: 40px;
    background: transparent;
    color: #986b32;
    font-size: 18px;
    cursor: pointer;
    font-family: Georgia, serif;
}

.heart {
    margin-top: 35px;
    font-size: 27px;
}

.invitation {
    padding: 55px 15px 35px;
}

.invitation img {
    display: block;
    width: 100%;
    max-width: 540px;
    height: auto;
    margin: 0 auto 35px;
    border-radius: 3px;
    box-shadow: 0 8px 25px rgba(130, 90, 40, 0.10);
}

.divider {
    width: 100px;
    height: 1px;
    background: #c69a60;
    margin: 35px auto;
}

.map-btn {
    display: inline-block;
    padding: 15px 28px;
    border: 1px solid #bd8a4a;
    border-radius: 40px;
    text-decoration: none;
    color: #986b32;
    font-size: 18px;
    margin: 10px 0 40px;
}

.music-btn {
    position: fixed;
    bottom: 20px;
    right: 15px;
    padding: 13px 20px;
    border: 1px solid #bd8a4a;
    background: #fffaf4;
    color: #986b32;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
    z-index: 10;
}

.footer {
    padding: 40px 15px 70px;
    font-size: 20px;
    font-style: italic;
}
</style>
</head>

<body>

<section class="hero">

    <div class="ornament">❧</div>

    <p class="intro">
        Сиздерди биздин кубанычтуу күнүбүзгө чакырабыз
    </p>

    <div class="names">
        Улан
        <div class="amp">&</div>
        Толкунай
    </div>

    <p class="date">3-декабрь · 16:00</p>

    <button class="open-btn"
    onclick="document.getElementById('invitation').scrollIntoView({behavior:'smooth'})">
        Чакыруу барагын ачуу
    </button>

    <div class="heart">♡</div>

</section>

<section class="invitation" id="invitation">

    <div class="divider"></div>

    <img src="assets/01-names-ulan-tolkunai.png"
         alt="Улан жана Толкунай">

    <div class="divider"></div>

    <img src="assets/02-invitation-text.png"
         alt="Урматтуу коноктор">

    <div class="divider"></div>

    <img src="assets/03-date-time.png"
         alt="Той күнү жана убактысы">

    <div class="divider"></div>

    <img src="assets/04-address.png"
         alt="Тойдун дареги">

    <a class="map-btn"
       href="https://www.google.com/maps/search/?api=1&query=Айдаркен+кафеси+Балыкчы"
       target="_blank">
       Даректи картадан көрүү ↗
    </a>

    <div class="divider"></div>

    <img src="assets/05-hosts-akylbek-gulbara.png"
         alt="Той ээлери Акылбек жана Гүлбара">

</section>

<div class="footer">
    Сиздерди чыдамсыздык менен күтөбүз ♡
</div>

<audio id="music" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="toggleMusic()" id="musicButton">
    ♫ Музыканы күйгүзүү
</button>

<script>
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

function toggleMusic() {
    if (music.paused) {
        music.play().then(() => {
            musicButton.innerHTML = "♫ Музыканы токтотуу";
        }).catch(() => {
            alert("Музыканы кайра басып күйгүзүңүз.");
        });
    } else {
        music.pause();
        musicButton.innerHTML = "♫ Музыканы күйгүзүү";
    }
}
</script>

</body>
</html>
